baseURL = 'https://go-fem.github.io/'
locale  = 'en-us'
title   = 'go-fem'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-fem (planned, wave 3): finite elements and PDE solvers in pure Go (CGO=0): Lagrange P1/P2 elements, quadrature, assembly and boundary conditions, Poisson, heat and elasticity, validated by manufactured solutions."

# Every field below is rendered by layouts/index.html. A field nothing renders
# does not stay true. The organization is planned: no library has a repository.
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-fem.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the scope, the plan and one page per planned package, with its references. <a href=\"https://github.com/go-fem/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-fem/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

[[params.packages]]
  name  = "fem"
  wave  = 3
  href  = "https://go-fem.github.io/docs/latest/fem/"
  blurb = "Lagrange finite elements, quadrature, assembly, boundary conditions and the first PDE solvers."
[[params.packages]]
  name  = "mms"
  wave  = 3
  href  = "https://go-fem.github.io/docs/latest/mms/"
  blurb = "The shared method-of-manufactured-solutions convergence harness."

# The cards of #checks and their count come from this list. Each statement is
# a plan, from the roadmap's bibliography, not a result.
[[params.checks]]
  name = "Observed convergence order"
  what = "Within 0.1 of theory: h^(p+1) in L2 and h^p in H1 for Pp elements, on a refinement sequence. (planned)"
[[params.checks]]
  name = "Error against the exact solution"
  what = "Relative L2 error against the manufactured solution, and the relative residual of the linear solve. (planned)"
[[params.checks]]
  name = "Oracle on a shared mesh"
  what = "P1/P2 Poisson solutions compared with FEniCS/DOLFINx on the same mesh, never node by node on different meshes. (planned)"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.95:1, bright on the dark background 11.27:1.
  base = "#5c7a0a"
  deep = "#384a06"
  bright = "#b5d23f"
  shadow = "rgba(92,122,10,.7)"
  glow = "rgba(92,122,10,.6)"
  wash = "rgba(92,122,10,.10)"
  washDeep = "rgba(56,74,6,.06)"
  chipBg = "#f6fae8"
  chipBorder = "#e9f2c5"
  chipFg = "#384a06"
  chipBgDark = "rgba(181,210,63,.14)"
  chipBorderDark = "rgba(181,210,63,.32)"
  chipFgDark = "#d6e695"
  statsEnd = "#edf4d1"
  bandText = "#f3f8e0"
